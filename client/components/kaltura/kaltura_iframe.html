        const iframe = document.querySelector('iframe');

        iframeDoc.querySelector('.playkit-pre-playback-play-button').style.backgroundColor = '#ff6600';

    <meta charset="utf-8">
    <title>Kaltura Video Player</title>
    <style>
        /* General font family for all player elements */
        .playkit-player-gui {
            font-family: 'Arial', sans-serif !important;
        }

        /* Play button before video starts */
        .playkit-pre-playback-play-button {
            background-color: #ff6600 !important;
            /* Orange background for play button */
            border-radius: 50%;
            width: 60px;
            height: 60px;
        }

        /* Play button icon */
        .playkit-icon-play {
            color: white !important;
            /* White play icon */
        }

        /* Pause button icon */
        .playkit-icon-pause {
            color: white !important;
            /* White pause icon */
        }

        /* Bottom control bar */
        .playkit-bottom-bar {
            background-color: #333 !important;
            /* Dark background for control bar */
        }

        /* Customize volume control bar */
        .playkit-volume-control-bar .playkit-bar {
            background-color: #aaa !important;
            /* Light gray volume bar background */
        }

        .playkit-volume-control-bar .playkit-progress {
            background-color: #ff6600 !important;
            /* Orange volume progress */
        }

        /* Customize seek bar */
        .playkit-seek-bar .playkit-progress-bar {
            background-color: #444 !important;
            /* Dark gray background for the progress bar */
        }

        .playkit-seek-bar .playkit-progress-bar .playkit-progress {
            background-color: #ff6600 !important;
            /* Orange progress bar */
        }

        /* Spinner (loading indicator) */
        .playkit-spinner span {
            display: none !important;
            /* Remove spinner */
        }

        /* Maximize/Minimize button customization */
        .playkit-icon-maximize,
        .playkit-icon-minimize {
            color: white !important;
            /* White maximize and minimize icons */
        }
    </style>
</head>
