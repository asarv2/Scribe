name: Docker Build and Deploy

on:
  push:
    branches: [ main, prod ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ashokhomepc/scribe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Login using the github.actor (whoever triggered the workflow)
      - name: Log in to GHCR for deploy
        env:
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Deploy to production
      - name: Deploy to production
        env:
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
          SUPABASE_PRIVATE_KEY: ${{ secrets.SUPABASE_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Determine which tag to use based on branch
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            TAG="prod"
            SERVICE="scribe"
            echo "Deploying to production (scribe service)"
          else
            TAG="main"
            SERVICE="scribe-dev"
            echo "Deploying to development (scribe-dev service)"
          fi
          
          # Verify environment variables are set (without exposing values)
          echo "Checking environment variables..."
          if [[ -z "$SUPABASE_SCHEMA" ]]; then echo "WARNING: SUPABASE_SCHEMA is not set"; fi
          if [[ -z "$SUPABASE_PRIVATE_KEY" ]]; then echo "WARNING: SUPABASE_PRIVATE_KEY is not set"; fi
          if [[ -z "$SUPABASE_URL" ]]; then echo "WARNING: SUPABASE_URL is not set"; fi
          if [[ -z "$OPENAI_API_KEY" ]]; then echo "WARNING: OPENAI_API_KEY is not set"; fi
          if [[ -z "$GOOGLE_API_KEY" ]]; then echo "WARNING: GOOGLE_API_KEY is not set"; fi
          if [[ -z "$NGROK_AUTHTOKEN" ]]; then echo "WARNING: NGROK_AUTHTOKEN is not set"; fi
          
          # Export environment variables for docker compose
          export SUPABASE_SCHEMA="$SUPABASE_SCHEMA"
          export SUPABASE_PRIVATE_KEY="$SUPABASE_PRIVATE_KEY"
          export SUPABASE_URL="$SUPABASE_URL"
          export OPENAI_API_KEY="$OPENAI_API_KEY"
          export GOOGLE_API_KEY="$GOOGLE_API_KEY"
          export NGROK_AUTHTOKEN="$NGROK_AUTHTOKEN"
          
          # Alternative: Create .env file for docker compose
          cat > .env << EOF
          SUPABASE_SCHEMA=$SUPABASE_SCHEMA
          SUPABASE_PRIVATE_KEY=$SUPABASE_PRIVATE_KEY
          SUPABASE_URL=$SUPABASE_URL
          OPENAI_API_KEY=$OPENAI_API_KEY
          GOOGLE_API_KEY=$GOOGLE_API_KEY
          NGROK_AUTHTOKEN=$NGROK_AUTHTOKEN
          EOF
          
          # Pull the specific image for this deployment
          echo "Pulling image: ghcr.io/ashokhomepc/scribe:$TAG"
          docker pull ghcr.io/ashokhomepc/scribe:$TAG || {
            echo "Error: Image ghcr.io/ashokhomepc/scribe:$TAG not found"
            echo "Make sure the build job completed successfully"
            exit 1
          }
          
          # Create data directories if they don't exist
          mkdir -p ../../../scribe_data/{uploads,model_cache,gpu_lock,core}
          
          # Start the specific service and nginx (skip pulling other images)
          docker compose up -d --no-deps $SERVICE nginx
          
          # Keep ngrok running unless it's down (avoid starting dependencies like scribe-dev)
          if ! docker compose ps ngrok | grep -q "Up"; then
            echo "Starting ngrok service"
            docker compose up -d --no-deps ngrok
          else
            echo "Ngrok is already running, keeping it up"
          fi
          
          # Clean up old images
          docker image prune -f
          
