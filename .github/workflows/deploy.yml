name: Docker Build and Deploy

on:
  push:
    branches: [ main, prod ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ashokhomepc/scribe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Login using the github.actor (whoever triggered the workflow)
      - name: Log in to GHCR for deploy
        env:
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Deploy to production
      - name: Deploy to production
        env:
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
          SUPABASE_PRIVATE_KEY: ${{ secrets.SUPABASE_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Pull latest images
          docker compose pull
          
          # Only restart the specific service based on branch
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "Deploying to production (scribe service)"
            docker compose up -d scribe nginx
          else
            echo "Deploying to development (scribe-dev service)"
            docker compose up -d scribe-dev nginx
          fi
          
          # Keep ngrok running unless it's down
          if ! docker compose ps ngrok | grep -q "Up"; then
            echo "Starting ngrok service"
            docker compose up -d ngrok
          else
            echo "Ngrok is already running, keeping it up"
          fi
          
          # Clean up old images
          docker image prune -f